{% load static %}
<div class="basketball-game-heading">
  <div>
    <p class="basketball-game-eyebrow">A three-shot streak</p>
    <h2 id="basketball-game-heading">Make it three times<br />in a row.</h2>
    <p class="basketball-game-intro">Land three consecutive baskets to unlock a little thank-you.</p>
    <br>
  </div>



</div>
<!-- Static game composition. Add behavior in static/js/game.js only after the visual layout is approved. -->
<section class="basketball-game" aria-labelledby="basketball-game-heading">
  <div class="basketball-game-court" data-basketball-game role="application" aria-label="Basketball game. Drag the ball away from the hoop and release to shoot.">
    <div class="basketball-game-surface">
      <div class="basketball-game-score" aria-label="Game score preview">
        <span>Streak <strong data-game-streak>0/3</strong></span>
      </div>
      <span class="basketball-game-target" aria-hidden="true"></span>
    </div>

    <div class="basketball-game-hoop" data-game-hoop aria-hidden="true">
      <span class="basketball-game-backboard"></span>
      <img src="{% static 'images/game-assets/hoop-rim-back.svg' %}" alt="" />
      <img class="basketball-game-net" src="{% static 'images/game-assets/basketball-net.svg' %}" alt="" />
      <img class="basketball-game-rim-front" src="{% static 'images/game-assets/hoop-rim-front.svg' %}" alt="" />
    </div>

    <button class="basketball-game-coupon" data-game-coupon data-coupon-code="THANKYOU10" type="button" aria-label="Copy coupon code THANKYOU10" hidden>
      <span>10% OFF</span>
      <b>Three in a row!</b>
      <strong data-coupon-code-label>THANKYOU10</strong>
      <small data-coupon-note>Screenshot or tap to copy.</small>
      <i></i><i></i><i></i>
    </button>
    <span class="basketball-game-aim" data-game-aim aria-hidden="true"></span>
    <button class="basketball-game-ball" data-game-ball type="button" aria-label="Drag the basketball backwards and release to shoot">
      <i></i>
      <i></i>
      <i></i>
      <i></i>
    </button>
    <p class="basketball-game-status" data-game-status aria-live="polite">Pull the ball back, then release.</p>
  </div>
</section>
