# Blueprint: Common Ground web service + Supabase Postgres.
# Do not put real secrets in this file. SECRET_KEY is prompted in the dashboard.
# SECRET_KEY must also be available at *build* time so collectstatic can run.

services:
  - type: web
    name: counselling-site
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn ProjectCounsellingSite.wsgi:application --bind 0.0.0.0:$PORT --timeout 25
    envVars:
      - key: DB_HOST
        value: aws-1-ap-northeast-2.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.ezqhhvzkiqkrplykkjyd
      - key: DB_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
